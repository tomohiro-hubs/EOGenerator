<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>導入事例ジェネレーター</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background: #f1f5f9; color: #1e293b; font-family: "Hiragino Sans", "Yu Gothic", YuGothic, Meiryo, sans-serif; }
    .preview-frame { width: 100%; height: 760px; border: 0; background: #fff; }
    @media (max-width: 1023px) { .preview-frame { height: 680px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const formatNumber = (value, minimumFractionDigits = 0, maximumFractionDigits = 2) => {
      if (value === '' || Number.isNaN(value)) return '';
      return new Intl.NumberFormat('ja-JP', { minimumFractionDigits, maximumFractionDigits }).format(value);
    };

    // User-provided text is escaped before being inserted into the preview document.
    const escapeHtml = (value) => String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    const previewDocument = (data, stats) => {
      const location = data.location || '（場所）';
      const siteName = data.siteName || '（サイト名）';
      const equipment = data.equipment || '（太陽光発電設備・蓄電池など）';
      const isCustom = data.projectType === 'custom';
      const typeLabel = data.projectType === 'ground' ? '野立て' : data.projectType === 'self' ? '自家消費' : 'カスタム';
      const summary = data.projectType === 'ground'
        ? `エイコーエナジオ株式会社は、${location}において、太陽光発電所の開発を行いました。`
        : data.projectType === 'self'
          ? `エイコーエナジオ株式会社は、${location}において、${equipment}による自家消費システムの導入支援を行いました。`
          : (data.customText || 'ここに自由記述の紹介文が表示されます。');
      const facilityType = data.projectType === 'ground'
        ? '野立て型太陽光発電所'
        : data.projectType === 'self'
          ? '自家消費システム'
          : 'カスタム';
      const dcText = stats.dcDisplay ? `${stats.dcDisplay}kW` : '－';
      const acText = stats.acDisplay ? `${stats.acDisplay}kW` : '－';
      const panelText = data.panelW && data.panelCount
        ? `${escapeHtml(data.panelW)}W × ${stats.panelCountDisplay}枚<br>（パネル合計容量：${dcText}）`
        : '－';
      const pcsText = data.pcsKw && data.pcsCount
        ? `${escapeHtml(data.pcsKw)}kW × ${stats.pcsCountDisplay}台<br>（PCS合計容量：${acText}）`
        : '－';

      return `<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #222; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", YuGothic, Meiryo, sans-serif; }
  .project-case { padding: 64px 24px; }
  .project-case__inner { width: 100%; max-width: 960px; margin: 0 auto; }
  .project-case__header { padding-bottom: 48px; border-bottom: 1px solid #d9d9d9; }
  .project-case__category { margin: 0 0 16px; color: #666; font-size: 12px; font-weight: 600; letter-spacing: .12em; }
  .project-case__title { margin: 0; color: #1f2d3d; font-size: clamp(30px, 4vw, 40px); font-weight: 600; line-height: 1.45; letter-spacing: .02em; }
  .project-case__summary { margin: 28px 0 0; color: #555; font-size: 16px; line-height: 1.9; }
  .project-case__section, .project-case__contact { padding: 56px 0; border-bottom: 1px solid #d9d9d9; }
  .project-case__heading { margin: 0 0 28px; color: #1f2d3d; font-size: 22px; font-weight: 600; line-height: 1.5; }
  .project-case__data { margin: 0; border-top: 1px solid #d9d9d9; }
  .project-case__data-row { display: grid; grid-template-columns: 220px 1fr; border-bottom: 1px solid #d9d9d9; }
  dt, dd { margin: 0; padding: 18px 20px; font-size: 15px; line-height: 1.7; }
  dt, th { color: #444; background: #f6f6f6; font-weight: 600; }
  dd, td { color: #222; background: #fff; }
  table { width: 100%; border-collapse: collapse; border-top: 1px solid #d9d9d9; }
  th, td { padding: 18px 20px; border-bottom: 1px solid #d9d9d9; font-size: 15px; line-height: 1.7; text-align: left; vertical-align: middle; }
  th { width: 220px; }
  .project-case__contact { border-bottom: 0; }
  .project-case__contact-text { margin: 0; color: #555; font-size: 15px; line-height: 1.9; }
  .project-case__contact-info { margin-top: 24px; color: #333; font-size: 15px; line-height: 1.8; }
  .project-case__contact-info p { margin: 0; }
  .project-case__company-name { font-weight: 600; }
  .project-case__button { display: flex; align-items: center; justify-content: center; width: fit-content; min-width: 240px; margin: 32px auto 0; padding: 15px 32px; border: 1px solid #c62828; color: #fff; background: #c62828; font-size: 15px; font-weight: 600; text-decoration: none; transition: color .2s ease, background-color .2s ease; }
  .project-case__button:hover { color: #c62828; background: #fff; }
  .project-case__button:focus-visible { outline: 3px solid rgba(198, 40, 40, .3); outline-offset: 3px; }
  @media (max-width: 767px) { .project-case { padding: 48px 20px; } .project-case__header { padding-bottom: 36px; } .project-case__title { font-size: 28px; } .project-case__summary { margin-top: 20px; font-size: 15px; } .project-case__section, .project-case__contact { padding: 40px 0; } .project-case__heading { margin-bottom: 20px; font-size: 20px; } .project-case__data-row { grid-template-columns: 1fr; } dt, dd, th, td { padding: 14px 16px; } dt { border-bottom: 1px solid #e6e6e6; } th { width: 46%; } .project-case__button { width: 100%; max-width: 360px; } }
</style></head><body>
<section class="project-case"><div class="project-case__inner">
  <header class="project-case__header">
    <p class="project-case__category">${typeLabel}</p>
    <h1 class="project-case__title">${escapeHtml(location)}<br>${escapeHtml(siteName)}</h1>
    <p class="project-case__summary">${escapeHtml(summary).replace(/\n/g, '<br>')}</p>
    <!-- ####
      画像を掲載する場合は、以下のコメントを解除し、src と alt を案件に合わせて設定してください。
      <div class="project-case__image">
        <img src="Images/example.jpg" alt="案件写真の説明">
      </div>
    -->
  </header>
  <section class="project-case__section"><h2 class="project-case__heading">プロジェクト概要</h2>
    <dl class="project-case__data">
      <div class="project-case__data-row"><dt>所在地</dt><dd>${escapeHtml(location)}</dd></div>
      <div class="project-case__data-row"><dt>発電所形式</dt><dd>${facilityType}</dd></div>
      <div class="project-case__data-row"><dt>種別</dt><dd>${typeLabel}</dd></div>
      <div class="project-case__data-row"><dt>DC容量</dt><dd>${dcText}</dd></div>
      <div class="project-case__data-row"><dt>AC容量</dt><dd>${acText}</dd></div>
    </dl>
  </section>
  <section class="project-case__section"><h2 class="project-case__heading">導入設備</h2>
    <table><tbody><tr><th scope="row">太陽光パネル</th><td>${panelText}</td></tr><tr><th scope="row">パワーコンディショナー</th><td>${pcsText}</td></tr></tbody></table>
  </section>
  <section class="project-case__contact"><h2 class="project-case__heading">お問い合わせ</h2>
    <p class="project-case__contact-text">本件および太陽光発電所の開発に関するご相談は、下記までお問い合わせください。</p>
    <div class="project-case__contact-info"><p class="project-case__company-name">エイコーエナジオ株式会社</p><p>本社 営業開発部</p><p>TEL：06-7177-3789</p></div>
    <a href="https://www.energio.jp/postmail/postmail.html" target="_blank" rel="noopener noreferrer" class="project-case__button">お問い合わせ</a>
  </section>
</div></section></body></html>`;
    };

    const App = () => {
      const [formData, setFormData] = useState({
        projectType: 'ground', location: '', siteName: '', equipment: '', customText: '',
        panelW: '', panelCount: '', pcsKw: '', pcsCount: ''
      });

      const handleInput = (event) => {
        const { name, value } = event.target;
        setFormData((current) => ({ ...current, [name]: value }));
      };

      const reset = () => setFormData({
        projectType: 'ground', location: '', siteName: '', equipment: '', customText: '',
        panelW: '', panelCount: '', pcsKw: '', pcsCount: ''
      });

      const panelW = Number.parseFloat(formData.panelW);
      const panelCount = Number.parseFloat(formData.panelCount);
      const pcsKw = Number.parseFloat(formData.pcsKw);
      const pcsCount = Number.parseFloat(formData.pcsCount);
      const dc = Number.isFinite(panelW) && Number.isFinite(panelCount) ? panelW * panelCount / 1000 : NaN;
      const ac = Number.isFinite(pcsKw) && Number.isFinite(pcsCount) ? pcsKw * pcsCount : NaN;
      const stats = {
        dcDisplay: Number.isFinite(dc) ? formatNumber(dc, 2, 2) : '',
        acDisplay: Number.isFinite(ac) ? formatNumber(ac, 0, 2) : '',
        panelCountDisplay: Number.isFinite(panelCount) ? formatNumber(panelCount) : '',
        pcsCountDisplay: Number.isFinite(pcsCount) ? formatNumber(pcsCount) : ''
      };
      const generatedHtml = previewDocument(formData, stats);

      const downloadHtml = () => {
        const blob = new Blob([generatedHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const fileName = (formData.siteName || '導入事例').replace(/[\\/:*?"<>|]/g, '_');

        link.href = url;
        link.download = `${fileName}.html`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 0);
      };

      return <div className="min-h-screen">
        <header className="sticky top-0 z-10 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
          <div className="mx-auto flex h-16 max-w-screen-2xl items-center px-4 sm:px-6">
            <div><p className="text-xs font-semibold tracking-widest text-slate-500">EIKOH ENERGIO</p><h1 className="text-lg font-bold text-slate-800">導入事例ジェネレーター</h1></div>
          </div>
        </header>
        <main className="mx-auto max-w-screen-2xl px-4 py-6 sm:px-6 lg:py-8">
          <div className="grid gap-6 lg:grid-cols-[390px_minmax(0,1fr)] xl:grid-cols-[430px_minmax(0,1fr)]">
            <section className="h-fit rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:sticky lg:top-24">
              <div className="mb-5 border-b border-slate-100 pb-4"><h2 className="text-lg font-bold">入力内容</h2><p className="mt-1 text-sm text-slate-500">入力すると右のプレビューに反映されます。</p></div>
              <div className="space-y-5">
                <div><label htmlFor="projectType" className="mb-1.5 block text-sm font-semibold text-slate-700">種別</label><select id="projectType" name="projectType" value={formData.projectType} onChange={handleInput} className="w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm shadow-sm focus:border-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200"><option value="ground">野立て</option><option value="self">自家消費</option><option value="custom">カスタム</option></select></div>
                <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2">
                  <div><label htmlFor="location" className="mb-1.5 block text-sm font-semibold text-slate-700">場所</label><input id="location" type="text" name="location" value={formData.location} onChange={handleInput} placeholder="例：滋賀県米原市" className="w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm shadow-sm focus:border-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200" /></div>
                  <div><label htmlFor="siteName" className="mb-1.5 block text-sm font-semibold text-slate-700">サイト名（発電所名）</label><input id="siteName" type="text" name="siteName" value={formData.siteName} onChange={handleInput} placeholder="例：太陽光発電所" className="w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm shadow-sm focus:border-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200" /></div>
                </div>
                {formData.projectType === 'self' && <div><label htmlFor="equipment" className="mb-1.5 block text-sm font-semibold text-slate-700">導入設備</label><input id="equipment" type="text" name="equipment" value={formData.equipment} onChange={handleInput} placeholder="例：太陽光発電設備と蓄電池" className="w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm shadow-sm focus:border-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200" /><p className="mt-1 text-xs text-slate-500">紹介文内の「××」に反映されます。</p></div>}
                {formData.projectType === 'custom' && <div><label htmlFor="customText" className="mb-1.5 block text-sm font-semibold text-slate-700">自由記述</label><textarea id="customText" name="customText" value={formData.customText} onChange={handleInput} rows="4" placeholder="プレビューに表示する紹介文を入力してください。" className="w-full resize-y rounded-md border border-slate-300 px-3 py-2.5 text-sm shadow-sm focus:border-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200" /></div>}
                <fieldset className="rounded-lg border border-slate-200 bg-slate-50 p-4"><legend className="px-1 text-sm font-bold text-slate-700">導入設備</legend><div className="mt-2 grid grid-cols-2 gap-3"><div><label htmlFor="panelW" className="mb-1 block text-xs font-medium text-slate-600">パネル容量 (W)</label><input id="panelW" type="number" min="0" name="panelW" value={formData.panelW} onChange={handleInput} placeholder="595" className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" /></div><div><label htmlFor="panelCount" className="mb-1 block text-xs font-medium text-slate-600">パネル枚数</label><input id="panelCount" type="number" min="0" name="panelCount" value={formData.panelCount} onChange={handleInput} placeholder="352" className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" /></div><div><label htmlFor="pcsKw" className="mb-1 block text-xs font-medium text-slate-600">PCS容量 (kW)</label><input id="pcsKw" type="number" min="0" step="0.1" name="pcsKw" value={formData.pcsKw} onChange={handleInput} placeholder="50" className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" /></div><div><label htmlFor="pcsCount" className="mb-1 block text-xs font-medium text-slate-600">PCS台数</label><input id="pcsCount" type="number" min="0" name="pcsCount" value={formData.pcsCount} onChange={handleInput} placeholder="3" className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm" /></div></div><div className="mt-3 grid grid-cols-2 gap-3 text-sm"><p className="rounded bg-white p-2 text-slate-600">DC容量 <span className="float-right font-bold text-slate-800">{stats.dcDisplay || '－'} {stats.dcDisplay && 'kW'}</span></p><p className="rounded bg-white p-2 text-slate-600">AC容量 <span className="float-right font-bold text-slate-800">{stats.acDisplay || '－'} {stats.acDisplay && 'kW'}</span></p></div></fieldset>
              </div>
              <button type="button" onClick={reset} className="mt-6 w-full rounded-md border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300">入力をリセット</button>
            </section>
            <section className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"><div className="flex items-center justify-between gap-3 border-b border-slate-200 bg-slate-800 px-5 py-3"><h2 className="font-bold text-white">ライブプレビュー</h2><div className="flex items-center gap-2"><span className="hidden rounded bg-slate-700 px-2 py-1 text-xs text-slate-200 sm:inline">表示イメージ</span><button type="button" onClick={downloadHtml} className="rounded bg-white px-3 py-1.5 text-xs font-bold text-slate-800 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-slate-800">HTMLをダウンロード</button></div></div><iframe title="導入事例プレビュー" className="preview-frame" srcDoc={generatedHtml} /></section>
          </div>
        </main>
      </div>;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
